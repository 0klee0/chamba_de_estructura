<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%" fill="none">
  <rect width="400" height="240" fill="#FAFAFA" class="dark:fill-[#161616]" rx="0"/>
  
  <!-- Subtle Grid pattern -->
  <defs>
    <pattern id="grid-mat" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E5E5E5" stroke-width="0.5" class="dark:stroke-[#252525]"/>
    </pattern>
    <linearGradient id="doll-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" class="dark:stop-color-[#222222]"/>
      <stop offset="100%" stop-color="#EEEEEE" class="dark:stop-color-[#181818]"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#grid-mat)" opacity="0.7"/>

  <!-- Base ground line -->
  <line x1="20" y1="200" x2="380" y2="200" stroke="#737373" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- DOLL 1: Large Doll (Outer shell) -->
  <g transform="translate(60, 110)">
    <!-- Lower body -->
    <path d="M-36,90 C-42,50 -38,10 -22,0 C-18,-15 -2,-25 0,-25 C2,-25 18,-15 22,0 C38,10 42,50 36,90 Z" 
          fill="url(#doll-grad)" stroke="#171717" stroke-width="1.75" class="dark:stroke-[#E5E5E5]"/>
    <!-- Head ornament / face circle -->
    <circle cx="0" cy="-3" r="14" fill="#FFFFFF" class="dark:fill-[#262626]" stroke="#171717" stroke-width="1.2" class="dark:stroke-[#E5E5E5]"/>
    <circle cx="-4" cy="-5" r="1.5" fill="#171717" class="dark:fill-[#E5E5E5]"/>
    <circle cx="4" cy="-5" r="1.5" fill="#171717" class="dark:fill-[#E5E5E5]"/>
    <path d="M-3,3 Q0,6 3,3" stroke="#171717" stroke-width="1" fill="none" class="dark:stroke-[#E5E5E5]"/>
    <!-- Decorative apron lines -->
    <path d="M-20,40 C-10,75 10,75 20,40" stroke="#737373" stroke-width="1" fill="none" stroke-dasharray="3 2"/>
    <circle cx="0" cy="55" r="6" stroke="#737373" stroke-width="0.8" fill="none"/>
    <!-- Label -->
    <text x="0" y="82" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" fill="#171717" class="dark:fill-[#E5E5E5]">f(n)</text>
    <text x="0" y="-35" font-family="sans-serif" font-size="8.5" text-anchor="middle" fill="#737373">Problema Inicial</text>
  </g>

  <!-- Flow arrow 1 -->
  <path d="M108,125 Q125,115 140,125" fill="none" stroke="#737373" stroke-width="1.2" stroke-dasharray="3 2" marker-end="url(#arrow)"/>
  <text x="124" y="112" font-family="monospace" font-size="7.5" text-anchor="middle" fill="#737373">- 1 paso</text>

  <!-- DOLL 2: Medium Doll -->
  <g transform="translate(170, 130)">
    <path d="M-26,70 C-30,40 -28,10 -16,0 C-14,-10 -2,-18 0,-18 C2,-18 14,-10 16,0 C28,10 30,40 26,70 Z" 
          fill="url(#doll-grad)" stroke="#171717" stroke-width="1.75" class="dark:stroke-[#E5E5E5]"/>
    <circle cx="0" cy="-2" r="10.5" fill="#FFFFFF" class="dark:fill-[#262626]" stroke="#171717" stroke-width="1" class="dark:stroke-[#E5E5E5]"/>
    <circle cx="-3" cy="-4" r="1.2" fill="#171717" class="dark:fill-[#E5E5E5]"/>
    <circle cx="3" cy="-4" r="1.2" fill="#171717" class="dark:fill-[#E5E5E5]"/>
    <path d="M-2,2 Q0,4 2,2" stroke="#171717" stroke-width="0.8" fill="none" class="dark:stroke-[#E5E5E5]"/>
    <text x="0" y="63" font-family="monospace" font-size="8.5" font-weight="bold" text-anchor="middle" fill="#171717" class="dark:fill-[#E5E5E5]">f(n-1)</text>
  </g>

  <!-- Flow arrow 2 -->
  <path d="M204,135 Q220,125 234,135" fill="none" stroke="#737373" stroke-width="1.2" stroke-dasharray="3 2"/>

  <!-- DOLL 3: Small Doll -->
  <g transform="translate(260, 145)">
    <path d="M-18,55 C-22,30 -20,8 -12,0 C-10,-8 -1,-13 0,-13 C1,-13 10,-8 12,0 C20,8 22,30 18,55 Z" 
          fill="url(#doll-grad)" stroke="#171717" stroke-width="1.5" class="dark:stroke-[#E5E5E5]"/>
    <circle cx="0" cy="-2" r="7.5" fill="#FFFFFF" class="dark:fill-[#262626]" stroke="#171717" stroke-width="1" class="dark:stroke-[#E5E5E5]"/>
    <text x="0" y="49" font-family="monospace" font-size="8" font-weight="bold" text-anchor="middle" fill="#171717" class="dark:fill-[#E5E5E5]">f(n-2)</text>
  </g>

  <!-- Flow arrow 3 -->
  <path d="M285,150 Q300,140 312,150" fill="none" stroke="#737373" stroke-width="1.2" stroke-dasharray="3 2"/>

  <!-- DOLL 4: Solid Base Doll (CASO BASE) -->
  <g transform="translate(340, 160)">
    <!-- Glow aura -->
    <circle cx="0" cy="20" r="30" fill="#E5E5E5" opacity="0.3" class="dark:fill-[#333333]"/>
    <!-- Solid body filled with black/white high contrast -->
    <path d="M-13,40 C-16,22 -14,6 -8,0 C-7,-6 0,-10 0,-10 C0,-10 7,-6 8,0 C14,6 16,22 13,40 Z" 
          fill="#171717" class="dark:fill-[#F5F5F5]" stroke="#171717" stroke-width="1.5" class="dark:stroke-[#FFFFFF]"/>
    <circle cx="0" cy="-1" r="5" fill="#FFFFFF" class="dark:fill-[#171717]"/>
    
    <!-- Badge / Label -->
    <rect x="-35" y="-35" width="70" height="18" fill="#171717" class="dark:fill-[#FFFFFF]" rx="2"/>
    <text x="0" y="-23" font-family="monospace" font-size="8" font-weight="bold" text-anchor="middle" fill="#FFFFFF" class="dark:fill-[#171717]">CASO BASE</text>
    <text x="0" y="34" font-family="monospace" font-size="7.5" font-weight="bold" text-anchor="middle" fill="#FFFFFF" class="dark:fill-[#171717]">f(0)</text>
    <path d="M0,-17 L0,-10" stroke="#171717" class="dark:stroke-[#FFFFFF]" stroke-width="1.2"/>
  </g>

  <!-- Bottom Annotation Box -->
  <rect x="30" y="210" width="340" height="20" fill="#FFFFFF" class="dark:fill-[#1E1E1E]" stroke="#E5E5E5" class="dark:stroke-[#2E2E2E]" stroke-width="1"/>
  <text x="200" y="223" font-family="sans-serif" font-size="9" text-anchor="middle" fill="#525252" class="dark:fill-[#A3A3A3]">
    Cada muñeca contiene una versión menor. La más pequeña no se abre: es el freno.
  </text>
</svg>
